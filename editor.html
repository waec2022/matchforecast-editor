<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sure2OddToday Editor</title>
<style>
:root{--navy:#061330;--navy2:#0b2250;--blue:#0a6cff;--sky:#1e90ff;--bg:#f1f5fb;--card:#fff;--line:#dce6f4;--ink:#0b1b3b;--mut:#5b6b8a;--green:#12a150;--gbg:#e3f6ea;--yel:#b87500;--ybg:#fff1cc;--red:#e5484d;--rbg:#fde7e8;--r:14px}
*{box-sizing:border-box}

body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
body.noscroll{overflow:hidden}
img,svg{max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid #7fb4ff;outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
#banner{background:#ffe9a8;color:#5c4300;text-align:center;font-size:13px;padding:6px 12px}
/* hero */
.hero{position:relative;color:#fff;background:#061330 var(--heroimg,url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxNjAwIDcwMCIgcHJlc2VydmVBc3BlY3RSYXRpbz0ieE1pZFlNaWQgc2xpY2UiPjxkZWZzPjxsaW5lYXJHcmFkaWVudCBpZD0ic2t5IiB4MT0iMCIgeTE9IjAiIHgyPSIwIiB5Mj0iMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjMDYxMzMwIi8+PHN0b3Agb2Zmc2V0PSIuNiIgc3RvcC1jb2xvcj0iIzBhMmE2NiIvPjxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iIzBkM2I4YSIvPjwvbGluZWFyR3JhZGllbnQ+PGxpbmVhckdyYWRpZW50IGlkPSJwaXRjaCIgeDE9IjAiIHkxPSIwIiB4Mj0iMCIgeTI9IjEiPjxzdG9wIG9mZnNldD0iMCIgc3RvcC1jb2xvcj0iIzFjNmIzYSIvPjxzdG9wIG9mZnNldD0iMSIgc3RvcC1jb2xvcj0iIzBjM2ExZSIvPjwvbGluZWFyR3JhZGllbnQ+PHJhZGlhbEdyYWRpZW50IGlkPSJsMSI+PHN0b3Agb2Zmc2V0PSIwIiBzdG9wLWNvbG9yPSIjZmZmIiBzdG9wLW9wYWNpdHk9Ii45NSIvPjxzdG9wIG9mZnNldD0iLjI1IiBzdG9wLWNvbG9yPSIjOGNjNGZmIiBzdG9wLW9wYWNpdHk9Ii41Ii8+PHN0b3Agb2Zmc2V0PSIxIiBzdG9wLWNvbG9yPSIjMWU5MGZmIiBzdG9wLW9wYWNpdHk9IjAiLz48L3JhZGlhbEdyYWRpZW50PjwvZGVmcz48cmVjdCB3aWR0aD0iMTYwMCIgaGVpZ2h0PSI3MDAiIGZpbGw9InVybCgjc2t5KSIvPjxnIGZpbGw9IiMwYTFmNGEiIG9wYWNpdHk9Ii45Ij48cGF0aCBkPSJNMCAzMzBDMzAwIDI3MCA2MDAgMjUwIDgwMCAyNTBTMTMwMCAyNzAgMTYwMCAzMzBWNDcwSDB6Ii8+PC9nPjxnIGZpbGw9IiMxMjMwNmUiIG9wYWNpdHk9Ii44Ij48cGF0aCBkPSJNMCAzODBDMzAwIDMzMCA2MDAgMzEwIDgwMCAzMTBTMTMwMCAzMzAgMTYwMCAzODBWNDcwSDB6Ii8+PC9nPjxnIGZpbGw9IiMzYjc4ZDgiIG9wYWNpdHk9Ii4zNSI+PGNpcmNsZSBjeD0iMTIwIiBjeT0iMzYwIiByPSIzIi8+PGNpcmNsZSBjeD0iNDIwIiBjeT0iMzQ1IiByPSIzIi8+PGNpcmNsZSBjeD0iNzAwIiBjeT0iMzM1IiByPSIzIi8+PGNpcmNsZSBjeD0iMTAwMCIgY3k9IjMzOCIgcj0iMyIvPjxjaXJjbGUgY3g9IjEyODAiIGN5PSIzNTAiIHI9IjMiLz48Y2lyY2xlIGN4PSIxNTAwIiBjeT0iMzY1IiByPSIzIi8+PC9nPjxjaXJjbGUgY3g9IjExODAiIGN5PSIxMjAiIHI9IjE1MCIgZmlsbD0idXJsKCNsMSkiLz48Y2lyY2xlIGN4PSIxNDAwIiBjeT0iOTAiIHI9IjExMCIgZmlsbD0idXJsKCNsMSkiLz48Y2lyY2xlIGN4PSI4ODAiIGN5PSIxNDAiIHI9IjkwIiBmaWxsPSJ1cmwoI2wxKSIvPjxjaXJjbGUgY3g9IjEwMTAiIGN5PSI2MCIgcj0iNzAiIGZpbGw9InVybCgjbDEpIiBvcGFjaXR5PSIuNyIvPjxyZWN0IHk9IjQ1MCIgd2lkdGg9IjE2MDAiIGhlaWdodD0iMjUwIiBmaWxsPSJ1cmwoI3BpdGNoKS .hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,19,48,.95) 0,rgba(6,19,48,.72) 48%,rgba(6,19,48,.15) 100%)}
.hero .wrap{position:relative;z-index:2}
.brand{display:inline-flex;align-items:center;gap:12px;color:#fff;text-decoration:none;padding-top:18px}
.brand img{width:52px;height:52px}
.brand b{font-size:30px;letter-spacing:-.5px;display:block;line-height:1}
.brand small{font-size:12px;opacity:.8;display:block;margin-top:4px}
.hero-copy{max-width:560px;padding:22px 0 10px}
.hero h1{font-size:clamp(34px,6vw,56px);line-height:1.02;margin:0 0 14px;letter-spacing:-1px}
.hero h1 span{color:var(--sky)}
.hero p.lead{margin:0 0 20px;font-size:16px;color:#dbe7ff;max-width:480px}
.hero-ball{position:absolute;right:-3%;top:40px;width:min(34vw,380px);z-index:1;pointer-events:none}
.hero-note{position:absolute;right:26%;top:70px;z-index:1;font-style:italic;font-size:20px;line-height:1.2;transform:rotate(-8deg);color:#e6f0ff;margin:0;white-space:pre-line}
#searchForm{position:relative;display:flex;background:#fff;border-radius:999px;padding:6px 6px 6px 18px;align-items:center;max-width:520px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
#searchForm input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);padding:10px 8px;font-size:16px}
#searchForm button{border:0;background:var(--blue);color:#fff;width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
#results{position:absolute;left:0;right:0;top:calc(100% + 8px);background:#fff;color:var(--ink);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.3);list-style:none;margin:0;padding:6px;max-height:min(60vh,360px);overflow:auto;z-index:20}
#results li button{width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:10px;display:flex;flex-direction:column}
#results li button:hover,#results li button:focus-visible{background:#eef4ff}
#results small{color:var(--mut)}
#results .none{padding:12px;color:var(--mut)}
.strip{display:flex;align-items:center;gap:14px;margin-top:22px;padding:12px 16px;border:1px solid rgba(60,140,255,.6);border-radius:16px;background:rgba(6,19,48,.78)}
.strip .pl{width:54px;flex:none}
.strip .tx{flex:1;min-width:0}
.strip b{display:block;font-size:18px}
.strip small{color:#b9cdf5;font-size:13px}
.strip .mx{font-size:30px;font-weight:700;color:#7cc0ff;font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:11px 20px;font-weight:600;background:var(--blue);color:#fff;min-height:44px}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.6;cursor:default}
.btn.line{background:#fff;color:var(--blue);border-color:#b8d2fb}
.btn.red{background:#fff;color:var(--red);border-color:#f3b8ba}
.btn.sm{min-height:36px;padding:6px 14px;font-size:14px}
/* sections */
main{padding-top:22px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:26px}
.cd{border-radius:var(--r);padding:20px;text-decoration:none;display:block;position:relative;overflow:hidden;min-height:150px}
.cd h3{margin:0 0 6px;font-size:22px}
.cd p{margin:0 0 12px;max-width:340px}
.cd.dark{background:linear-gradient(135deg,#061330,#0e2a63);color:#fff}
.cd.dark p{color:#c3d4f6}
.cd.light{background:linear-gradient(135deg,#eaf3ff,#cfe3ff);color:var(--ink);border:1px solid #bcd6fb}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px}
.sec{margin:0 0 28px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{margin:0;font-size:24px}
.sec-h p{margin:2px 0 0;color:var(--mut);font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;background:#eaf1fc;color:var(--mut);white-space:nowrap}
.pill.demo{background:#fff1cc;color:#7a5200}.pill.live{background:var(--gbg);color:var(--green)}.pill.ed{background:#e6eeff;color:var(--blue)}
.st{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600}
.st::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.st.won,.st.completed{background:var(--gbg);color:var(--green)}
.st.pending,.st.active{background:var(--ybg);color:var(--yel)}
.st.lost,.st.failed{background:var(--rbg);color:var(--red)}
.st.void,.st.future{background:#eef1f6;color:var(--mut)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.toolbar select,.toolbar input[type=text],.toolbar input[type=number],.toolbar input:not([type]){border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;min-height:40px}
.toolbar label{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--mut)}
.feed{font-size:13px;color:var(--mut);margin:0 0 10px}
.feed.err{color:var(--red)}
.empty{background:#fff;border:1px dashed #b9c9e4;border-radius:var(--r);padding:22px;color:var(--mut);text-align:center}
.arb-list{display:grid;gap:8px}
.arb-row{display:grid;grid-template-columns:1fr auto auto auto 18px;gap:12px;align-items:center;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.arb-row:hover{border-color:#9cc2fa}
.arb-row .am b{display:block}
.arb-row .am small{color:var(--mut)}
.ab{font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px}
.ab.ok{background:var(--gbg);color:var(--green)}.ab.no{background:#eef1f6;color:var(--mut)}
.ap{font-weight:700;min-width:64px;text-align:right}
.more-btn{margin-top:10px}
/* packages */
.pkgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.pkg{position:relative;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"o d" "r a";gap:2px 6px;align-items:center;min-height:84px}
.pkg:hover{border-color:#8dbaf8}
.pkg b{grid-area:o;font-size:24px;letter-spacing:-.5px}
.pkg span.rl{grid-area:r;color:var(--mut);font-size:14px}
.pkg .dy{grid-area:d;justify-self:end;font-size:12px;background:#e7efff;color:#3b5db8;border-radius:8px;padding:2px 8px}
.pkg .dy.two{background:#efe6ff;color:#6b3fc4}
.pkg i{grid-area:a;justify-self:end;font-style:normal;color:var(--mut);font-size:20px}
.pkg.off{opacity:.55}
.pkg .seg{grid-column:1/-1;display:flex;gap:2px;margin-top:6px}
.pkg .seg u{flex:1;height:4px;border-radius:2px;background:#dfe6f2}
.pkg .seg u.won{background:var(--green)}.pkg .seg u.lost{background:var(--red)}.pkg .seg u.pending{background:#f5a30a}.pkg .seg u.void{background:#8aa0c5}
.note{grid-column:span 2;background:#e5f0ff;border:1px solid #c5dcfb;border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;color:#123a80}
.note b{display:block}
.note small{color:var(--mut)}
.bolt{width:40px;height:40px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none}
.duo2{display:grid;grid-template-columns:1.2fr 1fr;gap:16px;margin-bottom:26px}
.ticker{background:linear-gradient(135deg,#061330,#10306e);color:#fff;border-radius:var(--r);padding:20px;display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
.phone{width:140px;height:200px;border:6px solid #1c3f86;border-radius:22px;background:#e8f0ff;color:var(--ink);padding:12px 8px;position:relative;transform:rotate(-6deg)}
.phone small{display:block;font-weight:700;font-size:11px}
.phone .tk{margin-top:12px;background:linear-gradient(135deg,#0a6cff,#0b4fc0);color:#fff;border-radius:10px;padding:10px;text-align:center}
.phone .tk b{font-size:24px;display:block}
.ticker h3{margin:0 0 4px;font-size:22px}
.ticker dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:10px 0 14px;font-size:14px;color:#cfe0ff}
.ticker dd{margin:0;color:#fff;font-weight:600}
.how{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.how h3{margin:0 0 10px}
.how ol{margin:0;padding:0;list-style:none;display:grid;gap:8px;counter-reset:s}
.how li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;color:var(--mut);font-size:15px}
.how li::before{content:counter(s);flex:none;width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;font-size:13px;display:grid;place-items:center;font-weight:700}
.how .safe{margin-top:14px;background:#eef6ff;border-radius:10px;padding:10px 12px;font-size:13px;color:#33507f}
footer{text-align:center;color:var(--mut);font-size:14px;padding:12px 16px 40px}
/* dialogs */
dialog{border:0;padding:0;background:transparent;max-width:none;max-height:none;width:100%;height:100%;overflow:hidden;color:var(--ink)}
dialog[open]{display:flex;align-items:center;justify-content:center}
dialog::backdrop{background:rgba(5,14,36,.68)}
.sheet{background:#fff;border-radius:18px;width:min(880px,calc(100% - 20px));max-height:calc(100dvh - 20px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.sheet-h{display:flex;gap:14px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line)}
.sheet-h .ic{width:52px;height:52px;border-radius:50%;background:var(--blue);display:grid;place-items:center;flex:none}
.sheet-h h2{margin:0;font-size:22px}
.sheet-h p{margin:2px 0 0;color:var(--mut);font-size:14px}
.sheet-h .x{margin-left:auto;border:0;background:#eef3fb;border-radius:50%;width:44px;height:44px;font-size:22px;flex:none;line-height:1}
.sheet-b{overflow:auto;overscroll-behavior:contain;padding:14px 18px 18px;-webkit-overflow-scrolling:touch}
.stakebar{display:flex;gap:10px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:#f6f9ff;flex-wrap:wrap}
.stakebar input{border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:140px;min-height:40px;background:#fff}
.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.tm{display:flex;gap:10px;align-items:center}
.tm.r{flex-direction:row-reverse;text-align:right}
.crest{width:44px;height:44px;border-radius:50%;background:#e6eeff;color:var(--blue);display:grid;place-items:center;font-weight:700;flex:none;overflow:hidden}
.crest img{width:100%;height:100%;object-fit:contain}
.vs{text-align:center;font-size:13px;color:var(--mut)}
.vs b{background:#e6eeff;color:var(--blue);border-radius:8px;padding:2px 10px;display:inline-block;margin-bottom:4px}
.mk{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.mk-h{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.mk-h b{font-size:16px}
.oc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.o{border:1px solid var(--line);border-radius:10px;padding:10px;background:#fafcff}
.bk{display:inline-block;border-radius:6px;padding:2px 9px;font-weight:800;font-size:13px;margin-bottom:6px}
.o .nm{color:var(--mut);font-size:14px}
.o .od{font-size:22px;font-weight:700}
.o .sk{font-size:13px;color:var(--green);margin-top:4px}
.verdict{margin-top:8px;font-size:14px;font-weight:600}
.verdict.ok{color:var(--green)}.verdict.no{color:var(--mut)}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#f6f9ff}
.sum3 small{color:var(--mut);display:block}
.sum3 b{font-size:20px}
.disc{margin-top:12px;background:#eef6ff;border-radius:10px;padding:10px 12px;font-size:13px;color:#33507f}
/* rollover dialog */
.steps{display:flex;gap:0;margin:2px 0 12px;overflow-x:auto}
.steps button{flex:1;min-width:54px;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mut);position:relative;padding:4px 0}
.steps button::before{content:"";position:absolute;top:15px;left:-50%;width:100%;height:3px;background:#dfe6f2;z-index:0}
.steps button:first-child::before{display:none}
.steps button.won::before,.steps button.void::before{background:var(--green)}
.steps .dot{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid #cfd8e8;z-index:1;display:grid;place-items:center;font-size:12px;font-weight:700}
.steps .won .dot{background:var(--green);border-color:var(--green);color:#fff}
.steps .lost .dot{background:var(--red);border-color:var(--red);color:#fff}
.steps .pending .dot{background:#f5a30a;border-color:#f5a30a;color:#fff}
.steps .void .dot{background:#8aa0c5;border-color:#8aa0c5;color:#fff}
.steps .sel{color:var(--ink);font-weight:700}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.tabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.dsum{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:8px}
.dsum h3{margin:0;font-size:17px}
.sel-t{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sr1{display:grid;grid-template-columns:34px 1fr 90px 60px 96px;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.sr1:first-child{border-top:0}
.sr1.hd{background:#f4f8ff;color:var(--mut);font-weight:700;font-size:13px}
.sr1 .mt b{display:block;font-weight:600}
.sr1 .mt small{color:var(--mut)}
.sr1 .od{font-weight:700}
.legend{margin-top:12px;font-size:13px;color:var(--mut);background:#f4f8ff;border-radius:10px;padding:10px 12px}
.tgt{font-size:13px;margin:8px 0 0;padding:8px 10px;border-radius:10px}
.tgt.ok{background:var(--gbg);color:#0b6a35}.tgt.no{background:var(--ybg);color:#6d4800}
/* aviator dialog */
.sheet.av{width:min(520px,calc(100% - 20px))}
.sky{position:relative;height:200px;border-radius:14px;background:linear-gradient(#0b2b66,#123d85);overflow:hidden;container-type:size}
.sky #avMult{position:absolute;inset:0;display:grid;place-items:center;font-size:56px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums}
.crashed .sky #avMult{color:#ff8b8f}
#avPlane{position:absolute;left:8px;bottom:8px;width:44px}
.demo-tag{display:inline-block;background:#ffe9a8;color:#6d4800;border-radius:8px;padding:3px 10px;font-weight:700;font-size:13px}
.av-actions{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#0b1b3b;color:#fff;border-radius:10px;padding:10px 16px;z-index:50;font-size:14px;max-width:90vw}
@media (max-width:900px){.duo2{grid-template-columns:1fr}.note{grid-column:1/-1}}
@media (min-width:1024px){.pkgs{grid-template-columns:repeat(4,1fr)}}
@media (max-width:700px){
  .hero{border-radius:0 0 50% 50%/0 0 30px 30px}
  .hero-ball{width:46vw;right:-14%;top:90px;opacity:.5}
  .hero-note{display:none}
  .duo{grid-template-columns:1fr}

  .arb-row .ap{min-width:0;margin-left:auto}
  .arb-row i{position:absolute;right:12px;top:14px}
  .ticker{grid-template-columns:1fr}.phone{margin:0 auto}
  .teams{grid-template-columns:1fr;text-align:center}.tm,.tm.r{flex-direction:row;justify-content:center;text-align:left}

body.ed{background:#f3f6fb}
.ed-top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:8px 14px}
.ed-top .brand{color:var(--ink);padding:0;margin-right:auto}.ed-top .brand b{font-size:20px;display:inline}.ed-top .brand small{display:inline;font-size:13px;margin:0 0 0 6px}
.ed-shell{display:grid;grid-template-columns:200px 1fr;gap:0;max-width:1400px;margin:0 auto}
.ed-nav{padding:14px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:53px;align-self:start}
.ed-nav button{text-align:left;border:0;background:none;border-radius:10px;padding:10px 12px;font-weight:600;color:var(--mut)}
.ed-nav button.on{background:#dfeaff;color:var(--blue)}
.ed-main{padding:16px;min-width:0}
.ed-main h1{margin:0 0 4px;font-size:24px}.ed-main .sub{margin:0 0 14px;color:var(--mut)}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.panel h2{margin:0 0 10px;font-size:17px}
.grid2{display:grid;grid-template-columns:1fr 340px;gap:14px;align-items:start}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mut);min-width:0}
.f input,.f select,.f textarea,.erow input,.erow select{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;min-height:42px;width:100%;color:var(--ink);min-width:0}
.f textarea{min-height:80px}
.f.full{grid-column:1/-1}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink)}.chk input{width:auto;min-height:0}
.list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.list button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-weight:600;min-height:36px}
.list button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.list button.off{opacity:.55}
.erow{display:grid;grid-template-columns:28px 1.6fr 1fr 1fr 1fr 1fr 80px 100px auto;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.erow.hd{font-size:12px;color:var(--mut);font-weight:700;border-top:0}
.erow .acts{display:flex;gap:4px}
.erow .acts button{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:34px;min-height:38px}
.orow{display:grid;grid-template-columns:1.2fr 1.2fr 100px auto;gap:6px;align-items:center;margin:4px 0}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg{padding:10px 12px;border-radius:10px;margin:8px 0;font-size:14px}
.msg.ok{background:var(--gbg);color:#0b6a35}.msg.err{background:var(--rbg);color:#9b1c20}.msg.info{background:#eaf1ff;color:#1a3f86}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}.kv:first-of-type{border-top:0}
.cand{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:6px 0;font-size:14px}
.calc{font-size:14px}
.errlog{max-height:200px;overflow:auto;font-size:13px;color:#9b1c20}
@media (max-width:900px){
  .ed-shell{grid-template-columns:1fr}
  .ed-nav{flex-direction:row;overflow-x:auto;position:static;padding:8px;background:#fff;border-bottom:1px solid var(--line)}
  .ed-nav button{white-space:nowrap}
  .grid2{grid-template-columns:1fr}
  .erow{grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
  .erow.hd{display:none}
  .erow .n{grid-column:1/-1;font-weight:700}
  .erow input:first-of-type{grid-column:1/-1}
  .orow{grid-template-columns:1fr 1fr}
  .ed-top .btn.line{display:none}
}
